<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A9A5"/>
      <stop offset="100%" style="stop-color:#007A77"/>
    </linearGradient>
  </defs>
  <!-- Sun rays -->
  <g transform="translate(50,45)">
    <line x1="0" y1="-30" x2="0" y2="-38" stroke="#00A9A5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="21" y1="-21" x2="27" y2="-27" stroke="#00A9A5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="0" x2="38" y2="0" stroke="#00A9A5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="21" y1="21" x2="27" y2="27" stroke="#00A9A5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-21" y1="-21" x2="-27" y2="-27" stroke="#00A9A5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-30" y1="0" x2="-38" y2="0" stroke="#00A9A5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-21" y1="21" x2="-27" y2="27" stroke="#00A9A5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="30" x2="0" y2="38" stroke="#00A9A5" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Additional rays -->
    <line x1="15" y1="-27" x2="19" y2="-34" stroke="#00A9A5" stroke-width="2" stroke-linecap="round"/>
    <line x1="27" y1="-15" x2="34" y2="-19" stroke="#00A9A5" stroke-width="2" stroke-linecap="round"/>
    <line x1="27" y1="15" x2="34" y2="19" stroke="#00A9A5" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="27" x2="19" y2="34" stroke="#00A9A5" stroke-width="2" stroke-linecap="round"/>
    <line x1="-15" y1="-27" x2="-19" y2="-34" stroke="#00A9A5" stroke-width="2" stroke-linecap="round"/>
    <line x1="-27" y1="-15" x2="-34" y2="-19" stroke="#00A9A5" stroke-width="2" stroke-linecap="round"/>
    <line x1="-27" y1="15" x2="-34" y2="19" stroke="#00A9A5" stroke-width="2" stroke-linecap="round"/>
    <line x1="-15" y1="27" x2="-19" y2="34" stroke="#00A9A5" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Main sun circle -->
  <circle cx="50" cy="45" r="22" fill="url(#sunGrad)"/>
  <!-- Inner gold circle -->
  <circle cx="50" cy="45" r="14" fill="#C9A227" opacity="0.9"/>
  <!-- Youth figures (line art) -->
  <g transform="translate(50,45)" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Person 1 -->
    <circle cx="-6" cy="-5" r="2.5"/>
    <line x1="-6" y1="-2.5" x2="-6" y2="4"/>
    <line x1="-6" y1="4" x2="-8" y2="8"/>
    <line x1="-6" y1="4" x2="-4" y2="8"/>
    <line x1="-6" y1="0" x2="-9" y2="3"/>
    <!-- Person 2 (center) -->
    <circle cx="0" cy="-6" r="3"/>
    <line x1="0" y1="-3" x2="0" y2="5"/>
    <line x1="0" y1="5" x2="-2.5" y2="9"/>
    <line x1="0" y1="5" x2="2.5" y2="9"/>
    <line x1="0" y1="-1" x2="-3" y2="2"/>
    <line x1="0" y1="-1" x2="3" y2="2"/>
    <!-- Person 3 -->
    <circle cx="6" cy="-5" r="2.5"/>
    <line x1="6" y1="-2.5" x2="6" y2="4"/>
    <line x1="6" y1="4" x2="4" y2="8"/>
    <line x1="6" y1="4" x2="8" y2="8"/>
    <line x1="6" y1="0" x2="9" y2="3"/>
  </g>
  <!-- Text "يقين" -->
  <text x="50" y="88" text-anchor="middle" font-family="Amiri, serif" font-size="18" font-weight="700" fill="#C9A227">يقين</text>
</svg>
